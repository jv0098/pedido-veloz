services:
  api-gateway:
    image: nginx:1.25-alpine
    container_name: lv-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./docker/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - loja_network
    depends_on:
      pedidos-service:
        condition: service_started
      pagamento-service:
        condition: service_started
      estoque-service:
        condition: service_started
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pedidos-service:
    build:
      context: ./docker/pedidos
      dockerfile: Dockerfile
    container_name: lv-pedidos-service
    environment:
      - NODE_ENV=development
      - PORT=8081
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=loja_veloz
      - DB_USER=app_pedidos
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - db_password
      - jwt_secret
    networks:
      - loja_network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
  pagamento-service:
    build:
      context: ./docker/pagamento
      dockerfile: Dockerfile
    container_name: lv-pagamento-service
    environment:
      - NODE_ENV=development
      - PORT=8082
      - PEDIDOS_SERVICE_URL=http://pedidos-service:8081
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    networks:
      - loja_network
    depends_on:
      - pedidos-service
    restart: always

  estoque-service:
    build:
      context: ./docker/estoque
      dockerfile: Dockerfile
    container_name: lv-estoque-service
    environment:
      - NODE_ENV=development
      - PORT=8083
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=loja_veloz
      - DB_USER=app_estoque
      - DB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    networks:
      - loja_network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  postgres-db:
    image: postgres:15-alpine
    container_name: lv-postgres-db
    environment:
      - POSTGRES_DB=loja_veloz
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_root_password
    secrets:
      - postgres_root_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - loja_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loja_veloz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

networks:
  loja_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

secrets:
  db_password:
    file: .secrets/db_password.txt
  postgres_root_password:
    file: .secrets/postgres_root_password.txt
  jwt_secret:
    file: .secrets/jwt_secret.txt
