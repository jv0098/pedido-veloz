

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types application/json text/plain;

    server {
        listen       80;
        server_name  localhost;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Type "application/json; charset=utf-8";

        location /healthz {
            access_log off;
            return 200 '{"status":"UP", "service":"api-gateway"}';
        }

        location /api/pedidos {
            proxy_pass http://pedidos-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/pagamento {
            proxy_pass http://pagamento-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/estoque {
            proxy_pass http://estoque-service:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        error_page  404              /404.json;
        location = /404.json {
            return 404 '{"error": {"code": 404, "message": "Endpoint não encontrado no API Gateway"}}';
        }

        error_page   500 502 503 504  /50x.json;
        location = /50x.json {
            return 500 '{"error": {"code": 500, "message": "Falha na comunicação interna ou indisponibilidade de microsserviço"}}';
        }
    }
}
